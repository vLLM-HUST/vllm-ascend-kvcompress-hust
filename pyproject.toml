[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-ascend-kvcompress-hust"
version = "0.2.0"
description = "Extensible KV-cache compression methods for vLLM-Ascend-HUST"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "vLLM-HUST contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "vllm>=0.23.1,<0.24",
    "vllm-ascend-hust>=0.19.1,<0.20",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/vLLM-HUST/vllm-ascend-kvcompress-hust"
Repository = "https://github.com/vLLM-HUST/vllm-ascend-kvcompress-hust"
Issues = "https://github.com/vLLM-HUST/vllm-ascend-kvcompress-hust/issues"

[project.entry-points."vllm.general_plugins"]
ascend_kvcompress = "vllm_ascend_kvcompress.plugin:register"
triattention_ascend = "vllm_ascend_kvcompress.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
