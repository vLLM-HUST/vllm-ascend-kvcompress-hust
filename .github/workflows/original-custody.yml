name: Benchmark original custody
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff
      - run: ruff check scripts/fetch_benchmark_originals.py tests/test_original_custody.py
      - run: ruff format --check scripts/fetch_benchmark_originals.py tests/test_original_custody.py
      - run: python -m pytest -q tests/test_original_custody.py
      - run: python scripts/fetch_benchmark_originals.py "$RUNNER_TEMP/originals"
      - run: python -m pytest -q tests/test_leaderboard.py tests/test_benchmark_inputs.py
        env:
          VLLM_HUST_BENCHMARK_ORIGINALS: ${{ runner.temp }}/originals
      - run: python scripts/kvcompress_leaderboard.py --check
        env:
          VLLM_HUST_BENCHMARK_ORIGINALS: ${{ runner.temp }}/originals
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_leaderboard_browser.py --output "$RUNNER_TEMP/leaderboard-browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaderboard-browser
          path: ${{ runner.temp }}/leaderboard-browser
